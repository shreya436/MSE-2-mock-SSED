services:
  gateway:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: campushub-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    image: campushub-frontend:latest
    container_name: campushub-frontend
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile
    image: campushub-api:latest
    container_name: campushub-api
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - PGHOST=${PGHOST:-db}
      - PGUSER=${PGUSER:-campus}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE:-campushub}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_USER=${RABBITMQ_USER:-campus}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-campushub}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  worker:
    image: campushub-api:latest
    container_name: campushub-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_USER=${RABBITMQ_USER:-campus}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  db:
    image: postgres:16-alpine
    container_name: campushub-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PGUSER:-campus}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE:-campushub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-campus} -d ${PGDATABASE:-campushub}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: campushub-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campushub-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-campus}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  minio:
    image: minio/minio:latest
    container_name: campushub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - data
      - frontend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  mailhog:
    image: mailhog/mailhog:latest
    container_name: campushub-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  pgdata:
  miniodata:
